<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <title>Happy 44th Bibii Nakoo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #633d59;
      --pink: #ff729d;
      --deep-pink: #ef4e83;
      --lilac: #a996e8;
      --cream: #fffaf5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 28px 18px;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 12% 18%, #ffe1ec 0, transparent 34%),
        radial-gradient(ellipse at 88% 84%, #e8e2ff 0, transparent 38%),
        linear-gradient(135deg, #fff8f1, #fff0f6 55%, #f5f0ff);
    }

    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      color: #ef9db7;
      opacity: .7;
      animation: twinkle 3s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { top: 12%; left: 13%; font-size: 24px; }
    .sparkle:nth-child(2) { top: 22%; right: 15%; font-size: 17px; animation-delay: .8s; }
    .sparkle:nth-child(3) { bottom: 17%; left: 19%; font-size: 19px; animation-delay: 1.4s; }
    .sparkle:nth-child(4) { bottom: 23%; right: 12%; font-size: 26px; animation-delay: .4s; }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 590px);
      padding: clamp(30px, 7vw, 58px) clamp(22px, 7vw, 62px) 42px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 32px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 24px 70px rgba(151, 92, 130, .16), inset 0 1px 0 white;
      backdrop-filter: blur(12px);
    }

    .heart-art {
      width: 168px;
      max-width: 55%;
      margin: 0 auto 15px;
      filter: drop-shadow(0 12px 12px rgba(235, 91, 137, .2));
      animation: float 4s ease-in-out infinite;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #bd7795;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #bd547b;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 3.35rem);
      font-weight: 500;
      line-height: 1.15;
    }

    .subtitle {
      margin: 14px 0 30px;
      color: #8d6a82;
      font-size: 1.02rem;
      line-height: 1.7;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 0 auto 27px;
      color: #e5a0b8;
      font-size: 15px;
    }

    .divider::before, .divider::after {
      height: 1px;
      flex: 1;
      content: "";
      background: linear-gradient(90deg, transparent, #edc6d3);
    }

    .divider::after { transform: rotate(180deg); }

    h2 {
      margin: 0 0 22px;
      color: #73516d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      font-weight: 500;
    }

    .actions {
      position: relative;
      display: flex;
      min-height: 118px;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    button {
      min-width: 112px;
      padding: 13px 25px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    button:focus-visible {
      outline: 3px solid #aa8be1;
      outline-offset: 4px;
    }

    #yesButton {
      color: white;
      background: linear-gradient(135deg, #fa85a8, #e95f91);
      box-shadow: 0 8px 18px rgba(233, 95, 145, .25);
    }

    #yesButton:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 11px 22px rgba(233, 95, 145, .32);
    }

    #noButton {
      color: #966e8a;
      background: #f7edf3;
      border: 1px solid #f0dce7;
    }

    #noButton:hover { background: #f4e4ee; }

    .answer {
      min-height: 35px;
      margin: 20px 0 0;
      color: #d34f82;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      font-weight: 700;
    }

    .answer:empty { display: none; }

    .footer {
      margin: 20px 0 0;
      color: #b393a8;
      font-size: .82rem;
      letter-spacing: .04em;
    }

    #fireworks {
      position: fixed;
      z-index: 5;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-9px) rotate(2deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .35; transform: scale(.85); }
      50% { opacity: .95; transform: scale(1.15); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span class="sparkle">✦</span>
    <span class="sparkle">✧</span>
    <span class="sparkle">✧</span>
    <span class="sparkle">✦</span>
  </div>

  <main class="card">
    <svg class="heart-art" viewBox="0 0 200 180" role="img" aria-label="Two sweet hearts">
      <defs>
        <linearGradient id="pink" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#ffabc2"/>
          <stop offset="1" stop-color="#ee6798"/>
        </linearGradient>
        <linearGradient id="lavender" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#d4c7ff"/>
          <stop offset="1" stop-color="#a68ce3"/>
        </linearGradient>
      </defs>
      <path d="M99 155C80 139 39 110 39 72c0-22 15-37 35-37 13 0 23 7 29 19 6-12 17-19 30-19 20 0 35 15 35 37 0 38-41 67-69 83Z" fill="url(#lavender)" transform="rotate(10 100 95)"/>
      <path d="M91 145C74 130 40 106 40 75c0-18 12-31 29-31 11 0 20 6 25 16 5-10 14-16 25-16 17 0 29 13 29 31 0 31-34 55-57 70Z" fill="url(#pink)"/>
      <path d="M65 66c2-7 8-11 15-11" fill="none" stroke="#fff4f7" stroke-linecap="round" stroke-width="5" opacity=".8"/>
      <path d="M147 119c-4 8-11 15-18 20" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3" opacity=".65"/>
      <path d="m31 44 3 7 7 3-7 3-3 7-3-7-7-3 7-3Zm133 75 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#e7b5cf"/>
    </svg>

    <p class="eyebrow">To my Kaydet Girl Mrs Suabibii</p>
    <h1>Happy 44th Monthsary Bibii Nakoo</h1>
    <p class="subtitle">I know we're so far from each other bibii but I think of every passing days means I get closer to you. 💗</p>

    <div class="divider" aria-hidden="true">♥</div>

    <h2>Will you be my forever and ever bibii?</h2>
    <div class="actions" id="actions">
      <button id="yesButton" type="button">Yes 💖</button>
      <button id="noButton" type="button">No 🙈</button>
    </div>
    <p class="answer" id="answer" aria-live="polite"></p>
    <p class="footer">you + me, always ✨</p>
  </main>

  <canvas id="fireworks" aria-hidden="true"></canvas>

  <script>
    const yesButton = document.querySelector("#yesButton");
    const noButton = document.querySelector("#noButton");
    const actions = document.querySelector("#actions");
    const answer = document.querySelector("#answer");
    const canvas = document.querySelector("#fireworks");
    const context = canvas.getContext("2d");
    const colors = ["#ff719d", "#ffd166", "#b69cff", "#7edbd0", "#ff9f68", "#fff0a8"];
    let particles = [];
    let animationFrame = 0;

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function burst(x, y) {
      for (let i = 0; i < 65; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.3 + Math.random() * 4.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 45 + Math.random() * 35,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 2 + Math.random() * 2.5
        });
      }
    }

    function animateFireworks() {
      context.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles = particles.filter(particle => particle.life > 0);
      for (const particle of particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += 0.035;
        particle.vx *= 0.99;
        particle.life--;
        context.globalAlpha = Math.min(1, particle.life / 18);
        context.fillStyle = particle.color;
        context.beginPath();
        context.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        context.fill();
      }
      context.globalAlpha = 1;
      if (particles.length) {
        animationFrame = requestAnimationFrame(animateFireworks);
      } else {
        animationFrame = 0;
      }
    }

    function launchCelebration() {
      answer.textContent = "yeyyy my forever bibii";
      const width = window.innerWidth;
      const height = window.innerHeight;
      burst(width * 0.22, height * 0.28);
      burst(width * 0.78, height * 0.24);
      burst(width * 0.5, height * 0.18);
      if (!animationFrame) animationFrame = requestAnimationFrame(animateFireworks);
    }

    function moveNoButton() {
      const area = actions.getBoundingClientRect();
      const button = noButton.getBoundingClientRect();
      const maxX = Math.max(0, area.width - button.width);
      const maxY = Math.max(0, area.height - button.height);
      const currentX = noButton.offsetLeft;
      const currentY = noButton.offsetTop;
      let x = currentX;
      let y = currentY;

      for (let attempt = 0; attempt < 12 && Math.hypot(x - currentX, y - currentY) < 70; attempt++) {
        x = Math.random() * maxX;
        y = Math.random() * maxY;
      }

      noButton.style.position = "absolute";
      noButton.style.left = `${x}px`;
      noButton.style.top = `${y}px`;
    }

    yesButton.addEventListener("click", launchCelebration);
    noButton.addEventListener("pointerenter", moveNoButton);
    noButton.addEventListener("focus", moveNoButton);
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
